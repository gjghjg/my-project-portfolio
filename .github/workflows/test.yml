# GitHub Actions 工作流：每次推送代码自动运行测试
# 如果测试失败，GitHub 会在提交记录上显示红色叉号，并给你发邮件提醒。
name: 运行测试

on:
  push:
    branches: [main] # 推送到 main 分支时触发
  pull_request: # 有人提 PR 时也触发

jobs:
  test:
    runs-on: ubuntu-latest # 在 GitHub 提供的 Linux 虚拟机上运行

    steps:
      # 1. 把仓库代码拉下来
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js（本项目测试零依赖，不需要 npm install）
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. 运行测试
      - name: 运行测试
        run: npm test
